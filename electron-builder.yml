appId: io.github.debuneko233.zhuruacquisition
productName: Wave Collector
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
win:
  target:
    - nsis
  artifactName: WaveCollector-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asar: true
