name: Windows build and native roundtrip

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Native acquisition and CSV roundtrip
        run: pnpm test
      - name: Full app build and unpacked package
        run: pnpm build:unpack
      - name: Upload portable app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WaveCollector-win-unpacked
          path: dist/win-unpacked
          retention-days: 7
